<!-- Section 4: operation history (logic: static/js/history.js) -->
<section id="history" class="section" aria-labelledby="history-heading">
  <div class="section-header">
    <div class="section-heading">
      <span class="section-number" aria-hidden="true">4</span>
      <div>
        <h2 id="history-heading" class="section-title">History</h2>
        <p class="section-subtitle">This browser tab only. Keys are never recorded.</p>
      </div>
    </div>
    <button id="clearHistoryBtn" type="button" class="btn-danger" disabled>Clear history</button>
  </div>
  <div class="section-body">
    <p id="historyEmpty" class="hint">No operations yet.</p>
    <ol id="historyList" class="space-y-3"></ol>
  </div>
</section>
