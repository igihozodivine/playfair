<!-- Top bar: stays visible while scrolling (title, key status, "Learn" button) -->
<div class="top-bar">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <a href="#" class="flex min-w-0 items-center gap-2.5 sm:gap-3" aria-label="Playfair Cipher, back to top">
      <!-- Logo: a mini 2x2 matrix -->
      <span class="grid h-10 w-10 shrink-0 grid-cols-2 grid-rows-2 gap-0.5 rounded-xl bg-white/10 p-1 font-mono text-[10px] font-bold leading-none ring-1 ring-white/20" aria-hidden="true">
        <span class="grid place-items-center rounded bg-brand-400 text-brand-950">P</span>
        <span class="grid place-items-center rounded bg-white/20">L</span>
        <span class="grid place-items-center rounded bg-white/20">A</span>
        <span class="grid place-items-center rounded bg-accent-400 text-accent-950">Y</span>
      </span>
      <span class="whitespace-nowrap text-lg font-extrabold tracking-tight sm:text-2xl">Playfair Cipher</span>
    </a>

    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Turns green when a key is saved (see static/js/key.js) -->
      <div id="keyStatus" class="status-badge status-missing" role="status">
        <span class="status-dot"></span>
        <span id="keyStatusText" class="sr-only sm:not-sr-only">No key</span>
      </div>
      <button id="learnBtn" type="button" class="btn-light" aria-haspopup="dialog"><span class="sm:hidden">Learn</span><span class="hidden sm:inline">Learn Playfair</span></button>
    </div>
  </div>
</div>

<!-- Intro: one sentence and the three steps of using the app -->
<header class="hero">
  <div class="relative mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10 lg:px-8">
    <p class="text-xl font-medium text-brand-50 sm:text-2xl">
      Hide a message using a secret key and a 5&times;5 letter grid.
    </p>
    <ol class="mt-5 flex flex-wrap gap-3">
      <li><a href="#key-section" class="hero-step"><span class="hero-step-number">1</span>Save a key</a></li>
      <li><a href="#workspace" class="hero-step"><span class="hero-step-number">2</span>Encrypt or decrypt</a></li>
      <li><a href="#explanation" class="hero-step"><span class="hero-step-number">3</span>See each step</a></li>
    </ol>
  </div>
</header>
